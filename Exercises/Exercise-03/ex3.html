<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exercise 3 – Meshing</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: 'Arial', sans-serif;
      background-color: #fafafa;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 2em;
      margin-bottom: 30px;
      color: #111;
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1100px;
    }

    .image-grid img {
      width: 100%;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s ease;
    }

    .image-grid img:hover {
      transform: scale(1.02);
    }

    footer {
      margin-top: 40px;
      font-size: 1rem;
      text-align: center;
    }

    footer a {
      color: #1769ff;
      text-decoration: none;
      font-weight: bold;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1>Exercise 3: Meshing</h1>

  <div class="image-grid">
    <img src="https://i.postimg.cc/63SgQ9Fd/Screenshot-2025-05-03-at-12-01-23-PM.png" alt="Meshing 1">
    <img src="https://i.postimg.cc/3N516WPb/Screenshot-2025-05-03-at-12-01-35-PM.png" alt="Meshing 2">
    <img src="https://i.postimg.cc/7hn3W91f/Screenshot-2025-05-03-at-12-01-47-PM.png" alt="Meshing 3">
    <img src="https://i.postimg.cc/j2S2Rh0W/Screenshot-2025-05-03-at-12-02-00-PM.png" alt="Meshing 4">
    <img src="https://i.postimg.cc/c4jCNYDH/Screenshot-2025-05-03-at-12-02-13-PM.png" alt="Meshing 5">
  </div>

<footer>
  <p>View more at <a href="https://hayley319.github.io/Interactive-2025/Projects/Project-01/index-1.html" target="_blank">Hayley Lin's web</a></p>
</footer>


</body>
</html>
